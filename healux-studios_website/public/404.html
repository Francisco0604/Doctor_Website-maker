<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HealUX Studios - Redirecting...</title>
  <script>
    (function() {
      var repo = "/Doctor_Website-maker";
      var location = window.location;
      var path = location.pathname;
      var search = location.search;

      if (path.indexOf(repo) === 0) {
        path = path.substring(repo.length);
      }

      if (path.indexOf("/preview") === 0) {
        var siteParam = new URLSearchParams(search).get("site") || "activemotion-physio";
        window.location.replace(repo + "/?site=" + encodeURIComponent(siteParam));
      } else {
        window.location.replace(repo + "/");
      }
    })();
  </script>
</head>
<body style="background-color:#030712;color:#ffffff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p style="font-size:14px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:#9ca3af;">Redirecting to HealUX Studios...</p>
</body>
</html>
