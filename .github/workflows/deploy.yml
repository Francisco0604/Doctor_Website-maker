name: Deploy Healux Studio to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: healux-studios_website/package-lock.json

      - name: Install dependencies
        working-directory: ./healux-studios_website
        run: npm ci

      - name: Build static site
        working-directory: ./healux-studios_website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./healux-studios_website/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
