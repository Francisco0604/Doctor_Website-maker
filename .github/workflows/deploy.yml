name: Deploy Healux Studio to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build ActiveMotion Physiotherapy Sample
        run: |
          cd Sample/activemotion-physio
          npm install
          npm run build
          mkdir -p ../../healux-studios_website/public/samples/activemotion-physio
          cp -r out/* ../../healux-studios_website/public/samples/activemotion-physio/

      - name: Build BrightSmile Dental Sample
        run: |
          cd Sample/brightsmile-dental
          npm install
          npm run build
          mkdir -p ../../healux-studios_website/public/samples/brightsmile-dental
          cp -r out/* ../../healux-studios_website/public/samples/brightsmile-dental/

      - name: Build FamilyCare Clinic Sample
        run: |
          cd Sample/familycare-clinic
          npm install
          npm run build
          mkdir -p ../../healux-studios_website/public/samples/familycare-clinic
          cp -r out/* ../../healux-studios_website/public/samples/familycare-clinic/

      - name: Build Main Healux Studio Site
        working-directory: ./healux-studios_website
        run: |
          npm install
          npm run build
          node fix-sample-paths.mjs
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./healux-studios_website/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
